name: CI

# prompt.txt Prompt F1. Two jobs, deliberately split:
#   - `fast`: no external credentials needed, runs on every push and every
#     PR (including from forks) — real signal for any contributor.
#   - `live`: the RLS/adversarial-database and live-provider integration
#     suites, which need real Supabase + LLM vendor credentials. Gated to
#     push-to-main + manual dispatch only — see ADR-028 in
#     docs/DECISIONS.md for why (cost and PR-spend-abuse risk), not wired
#     up silently.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # vitest-browser-svelte's `client` project drives real Playwright
      # Chromium (docs/ARCHITECTURE.md Section 8 — "not jsdom"), which
      # `npm ci` alone doesn't provide: the `playwright` package installs,
      # but its actual browser binary is a separate download. Found by
      # actually running this workflow, not assumed — the first real run
      # failed here.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run lint
      # Deliberately no Supabase/vendor secrets in this job — confirms the
      # live-credential-gated suites skip cleanly here rather than
      # erroring, the same signal a fork PR with no secrets access gets.
      - run: npm test
      - run: npm run build

  live:
    name: Live-credential suites (RLS + provider integration)
    runs-on: ubuntu-latest
    needs: fast
    # Never for pull_request — see ADR-028. Only a push that lands on main
    # (i.e. after merge), or an explicit manual run.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
